  <script src="piece_defs.js?v=1.0.33"></script>
  <script>
  (function() {
      console.log("%c[Kinematics Simulation] Initializing Dependency Injection Shims...", "color: #00ff88; font-weight: bold;");

      // Global Registry for Active Level & Physics State
      window.__SIM_RUNTIME__ = {
          activeLevelRoot: null,
          activePhysicsWorld: null,
          physicsScale: 30.0, // Standard Box2DWeb meter-to-pixel scale factor
          mockRoot: null
      };

      // -------------------------------------------------------------
      // 1. Resilient Fallback Proxy for `currentLevelRoot`
      // -------------------------------------------------------------
      const createLevelRootProxy = (targetRoot) => {
          return new Proxy(targetRoot || {}, {
              get(target, prop) {
                  // Return original property if present
                  if (prop in target && target[prop] !== undefined && target[prop] !== null) {
                      if (typeof target[prop] === 'function') {
                          return target[prop].bind(target);
                      }
                      return target[prop];
                  }

                  // Deobfuscated: .physics() / _0x8ffd94(0xa72) / getPhysicsWorld
                  if (prop === 'physics' || prop === '_0xa72' || prop === 'getPhysicsWorld') {
                      return function() {
                          const activeRoot = window.__SIM_RUNTIME__.activeLevelRoot;
                          if (activeRoot && typeof activeRoot.physics === 'function' && activeRoot !== target) {
                              return activeRoot.physics();
                          }
                          if (activeRoot && typeof activeRoot.getPhysicsWorld === 'function' && activeRoot !== target) {
                              return activeRoot.getPhysicsWorld();
                          }
                          // Fallback Box2D World Provider
                          return window.__SIM_RUNTIME__.activePhysicsWorld || {
                              createBody: function(bodyDef) {
                                  console.warn("[Kinematics Simulation] createBody called on fallback physics wrapper");
                                  if (window.Box2D && window.Box2D.Dynamics && window.Box2D.Dynamics.b2World) {
                                      if (!window.__GLOBAL_B2_WORLD__) {
                                          const gravity = new window.Box2D.Common.Math.b2Vec2(0, 9.8);
                                          window.__GLOBAL_B2_WORLD__ = new window.Box2D.Dynamics.b2World(gravity, true);
                                      }
                                      return window.__GLOBAL_B2_WORLD__.CreateBody(bodyDef || new window.Box2D.Dynamics.b2BodyDef());
                                  }
                                  const fb = {
                                      createFixture: function() { return {}; },
                                      CreateFixture: function() { return {}; },
                                      setBullet: function() {},
                                      SetBullet: function() {},
                                      setDynamic: function() {},
                                      setStatic: function() {},
                                      setPosition: function(p) { this.position = p; },
                                      setActive: function() {},
                                      SetActive: function() {},
                                      setLinearVelocity: function() {},
                                      SetLinearVelocity: function() {},
                                      setPositionAndAngle: function() {},
                                      SetPositionAndAngle: function() {},
                                      setTransform: function() {},
                                      SetTransform: function() {},
                                      setUserData: function() {},
                                      SetUserData: function() {},
                                      getUserData: function() { return {}; },
                                      GetUserData: function() { return {}; },
                                      getPosition: function() { return { x: 0, y: 0 }; },
                                      GetPosition: function() { return { x: 0, y: 0 }; },
                                      getAngle: function() { return 0; },
                                      GetAngle: function() { return 0; }
                                  };
                                  return new Proxy(fb, { get(t, p) { if (p in t) return t[p]; return function() { return {}; }; } });
                              },
                              CreateBody: function(bodyDef) { return this.createBody(bodyDef); },
                              destroyBody: function() {},
                              DestroyBody: function() {}
                          };
                      };
                  }

                  // Deobfuscated: .getPhisicsToPixelScale() / _0x8ffd94(0x277a)
                  if (prop === 'getPhisicsToPixelScale' || prop === 'getPhysicsToPixelScale' || prop === 'meterScale' || prop === '_0x277a') {
                      return function() {
                          const activeRoot = window.__SIM_RUNTIME__.activeLevelRoot;
                          if (activeRoot && typeof activeRoot.getPhisicsToPixelScale === 'function' && activeRoot !== target) {
                              return activeRoot.getPhisicsToPixelScale();
                          }
                          if (activeRoot && typeof activeRoot.meterScale === 'function' && activeRoot !== target) {
                              return activeRoot.meterScale();
                          }
                          return window.__SIM_RUNTIME__.physicsScale;
                      };
                  }

                  return undefined;
              }
          });
      };

      window.__SIM_RUNTIME__.mockRoot = createLevelRootProxy({});

      // -------------------------------------------------------------
      // 2. Global Prototype Accessor Trapping for `currentLevelRoot`
      // -------------------------------------------------------------
      Object.defineProperty(Object.prototype, 'currentLevelRoot', {
          get: function() {
              if (this._explicit_currentLevelRoot) {
                  return this._explicit_currentLevelRoot;
              }
              return window.__SIM_RUNTIME__.activeLevelRoot || window.__SIM_RUNTIME__.mockRoot;
          },
          set: function(val) {
              if (val && typeof val === 'object') {
                  window.__SIM_RUNTIME__.activeLevelRoot = val;
                  if (typeof val.physics === 'function' || typeof val.getPhysicsWorld === 'function') {
                      try {
                          const worldInstance = (val.physics || val.getPhysicsWorld).call(val);
                          if (worldInstance) {
                              window.__SIM_RUNTIME__.activePhysicsWorld = worldInstance;
                          }
                      } catch (e) {}
                  }
                  this._explicit_currentLevelRoot = val;
              } else if (val === null || val === undefined) {
                  this._explicit_currentLevelRoot = window.__SIM_RUNTIME__.activeLevelRoot || window.__SIM_RUNTIME__.mockRoot;
              }
          },
          configurable: true,
          enumerable: false
      });

      // -------------------------------------------------------------
      // 3. Child View Option Cascader (`_options` Hook)
      // -------------------------------------------------------------
      Object.defineProperty(Object.prototype, '_options', {
          get: function() {
              return this.__stored_options || { currentLevelRoot: window.__SIM_RUNTIME__.activeLevelRoot || window.__SIM_RUNTIME__.mockRoot };
          },
          set: function(opt) {
              if (opt && typeof opt === 'object') {

                      opt.currentLevelRoot = window.__SIM_RUNTIME__.activeLevelRoot || window.__SIM_RUNTIME__.mockRoot;
                  }
              } else if (!opt) {
                  opt = { currentLevelRoot: window.__SIM_RUNTIME__.activeLevelRoot || window.__SIM_RUNTIME__.mockRoot };
              }
              this.__stored_options = opt;
          },
          configurable: true,
          enumerable: false
      });

      // -------------------------------------------------------------
      // 3.5 PHYSICAL_OBJECT_DEFS Safety Proxy (Real CDN Assets)
      // -------------------------------------------------------------
      const defaultPhysicsBodyDef = {
          shape: 'box',
          width: 70,
          height: 140,
          physicalScaleDown: 30,
          friction: 0.2,
          mass: 1,
          restitution: 0.2,
          isTrigger: true
      };

      const defaultPhysicsDef = {
          physics: {
              isDynamic: false,
              physicalBodies: [defaultPhysicsBodyDef]
          },
          visual: {
              scalePercentX: 1,
              scalePercentY: 1
          }
      };

      const createDefsProxy = (target) => {
          return new Proxy(target || {}, {
              get: function(t, prop) {
                  if (t[prop] && t[prop].physics) {
                      return t[prop];
                  }
                  return defaultPhysicsDef;
              }
          });
      };

      const cdnDefs = window.__MOCK_PIECE_DEFS__ || {};
      let _realPhysicalDefs = createDefsProxy({
          'bucketTrigger': cdnDefs['/assets/pieces/bucketTrigger/objDef.json'] || defaultPhysicsDef,
          'pegTypes/defaultPeg': cdnDefs['/assets/pieces/pegTypes/defaultPeg/objDef.json'] || defaultPhysicsDef,
          'pegTypes/magnetPeg': cdnDefs['/assets/pieces/pegTypes/magnetPeg/objDef.json'] || defaultPhysicsDef,
          'puck': cdnDefs['/assets/pieces/puck/objDef.json'] || defaultPhysicsDef,
          'playfieldWallDown': cdnDefs['/assets/pieces/playfieldWallDown/objDef.json'] || defaultPhysicsDef,
          'playfield': cdnDefs['/assets/pieces/playfield/objDef.json'] || defaultPhysicsDef
      });

      Object.defineProperty(Object.prototype, 'PHYSICAL_OBJECT_DEFS', {
          get: function() {
              return this.__physical_defs || _realPhysicalDefs;
          },
          set: function(val) {
              if (val && typeof val === 'object') {
                  this.__physical_defs = createDefsProxy(val);
              } else {
                  this.__physical_defs = _realPhysicalDefs;
              }
          },
          configurable: true,
          enumerable: false
      });

      // -------------------------------------------------------------

    const origError = console.error;
    console.error = function(...args) {
      origError.apply(console, args);
      for (const a of args) {
        if (a && a.stack) {
          console.log('%c FULL_STACK: ' + a.stack, 'background: red; color: white; font-size: 14px;');
        } else if (a && typeof a === 'object') {
          try {
            console.log('%c FULL_ERROR_DETAILS: ' + JSON.stringify(a, Object.getOwnPropertyNames(a)), 'background: red; color: yellow; font-size: 14px;');
          } catch(e) {}
        }
      }
    };
    window.addEventListener('error', function(e) {
      console.log('%c UNCAUGHT_ERROR: ' + (e.error ? e.error.stack : e.message), 'background: red; color: white; font-size: 14px;');
    });
    const logStyle = 'background:purple; color:white';
    const log = { mess: [] };
    const subject = {
      component: undefined,
      options: undefined,
      constructor(component, options) {
        this.component = component;
        this.options = options;
      },
      next(event) {
        log.mess.push(event);
        console.log(`%c arenax event ${JSON.stringify(event)} `, logStyle);
      },
      subscribe(fn) {
        console.log(`%c arenax subscribe ${JSON.stringify(fn)} `, logStyle);
      },
    };

    function renderGame() {
      console.log('%c loading script ', logStyle);
      const sdk = window.__arenax_v1__[atob('UHJpY2VJc1JpZ2h0UGxpbmtvR2FtZQ==')].game;
      window.sdk = sdk;
      console.log('%c register game ', logStyle);
      sdk.register(subject, {
        assetOriginUrl: '',
        configUrl: '',
        locale: 'en',
        eventList: [],
        rewardVideoAvailable: true
      });

      sdk.render(640, 480, 'gameContainer');
    }
  </script>

<body>

        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>

      </div>

  </div>

  <!-- Secret Dev Mode / Testing Console Modal -->
  <div id="devModal" class="modal-backdrop" onclick="if(event.target===this) toggleDevModal(false)">
    <div class="modal-card" style="max-width: 580px;">
      <div class="modal-header">
        <h3>🛠️ Dev Mode & Upgrade Testing Lab</h3>
        <button class="close-btn" onclick="toggleDevModal(false)">✕</button>
      </div>

      <!-- Section: Spawns & Chips -->
      <div class="dev-section">
        <div class="dev-section-title">🎱 Chip Inventory & Spawners</div>
        <div class="btn-row">
          <button class="dev-btn" onclick="devAddChips(5)">+5 Normal Chips</button>
          <button class="dev-btn gold" onclick="devAddChips(5, 1)">🟡 +5 Golden Chips</button>
          <button class="dev-btn cyan" onclick="devAddChips(5, 2)">⚡ +5 Charging Chips</button>

      <!-- Section: Upgrades & Powers -->
      <div class="dev-section">

        <div class="btn-row">
          <button class="dev-btn cyan" onclick="devSelectPower('clonerWall')">🌀 Cloning Wall</button>
          <button class="dev-btn green" onclick="devSelectPower('bouncyWall')">🛡️ Bouncy Wall</button>
          <button class="dev-btn" onclick="devSelectPower('createWall')">🧱 Standard Wall</button>
          <button class="dev-btn cyan" onclick="devSelectPower('clonerPeg')">⚡ Cloning Peg</button>
          <button class="dev-btn gold" onclick="devSelectPower('midasPeg')">🟡 Midas Peg</button>
          <button class="dev-btn" onclick="devSelectPower('magnet')">🧲 Magnet Peg</button>
          <button class="dev-btn green" onclick="devSelectPower('bouncyPegs2')">🟢 Bouncy Pegs</button>
          <button class="dev-btn gold" onclick="devSelectPower('x2Pocket')">💰 2x Multiplier Bin</button>
          <button class="dev-btn cyan" onclick="devSelectPower('telePocket')">🌀 Teleport Bin</button>
          <button class="dev-btn gold" onclick="devUpgradeAllBins()">🌟 +10K All Bins</button>
        </div>
      </div>

      <!-- Section: Progression & Levels -->
      <div class="dev-section">
        <div class="dev-section-title">🏆 Score & Level Progression</div>
        <div class="btn-row">
          <button class="dev-btn" onclick="devAddScore(10000)">+10,000 Score</button>
          <button class="dev-btn" onclick="devAddScore(100000)">+100,000 Score</button>
          <button class="dev-btn green" onclick="devWinRound()">🏁 Win Current Round</button>
          <button class="dev-btn" onclick="devShowUpgradeChoice()">📋 Pick A Power Menu</button>
          <button class="dev-btn" onclick="devRerollUpgrades()">🎲 Free Reroll</button>
        </div>
        <div style="margin-top: 10px; display:flex; align-items:center; gap:8px;">
          <span style="font-size:12px; color:#cbd5e1;">Jump to Level:</span>
          <select id="devLevelSelect" style="background:#1e293b; color:#fff; border:1px solid #475569; border-radius:6px; padding:4px 8px; font-size:12px;" onchange="devJumpLevel(this.value)">
            <option value="0">Level 1</option><option value="1">Level 2</option><option value="2">Level 3</option><option value="3">Level 4</option><option value="4">Level 5</option><option value="5">Level 6</option><option value="6">Level 7</option><option value="7">Level 8</option><option value="8">Level 9</option><option value="9">Level 10</option><option value="10">Level 11</option><option value="11">Level 12</option><option value="12">Level 13</option><option value="13">Level 14</option><option value="14">Level 15</option><option value="15">Level 16</option><option value="16">Level 17</option><option value="17">Level 18</option><option value="18">Level 19</option><option value="19">Level 20</option>
          </select>

      <!-- Section: Physics Controls -->
      <div class="dev-section">
        <div class="dev-section-title">🔬 Physics & Restitution Tuning</div>
        <div class="slider-row">
          <label>Gravity</label>
          <input type="range" id="gravSlider" min="0.2" max="3.0" step="0.1" value="1.0" oninput="devSetGravity(this.value)">
          <span id="gravVal" class="slider-val">1.0x</span>
        </div>
        <div class="slider-row">
          <label>Bounce</label>
          <input type="range" id="bounceSlider" min="0.1" max="2.5" step="0.1" value="1.0" oninput="devSetBounce(this.value)">
          <span id="bounceVal" class="slider-val">1.0x</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="devToast">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Ready</span>
  </div>

  <div id="gameContainer"></div>

  <script>
    // -------------------------------------------------------------
    // Universal Multi-Vendor Fullscreen Toggle
    // -------------------------------------------------------------
    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFS = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
      const isFS = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

      if (!isFS) {
        if (requestFS) {
          requestFS.call(docEl).catch(err => {
            console.warn('Fullscreen request failed:', err);
          });
        }
      } else {
        if (cancelFS) {
          cancelFS.call(doc);
        }
      }
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, () => {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        const btnSpan = document.querySelector('#fsToggleBtn span');
        if (btnSpan) {
          btnSpan.textContent = isFS ? 'Exit Full' : 'Fullscreen';
        }
        setTimeout(() => {
          window.dispatchEvent(new Event('resize'));
        }, 150);
      });
    });

    // -------------------------------------------------------------
    // Theme Manager
    // -------------------------------------------------------------
    function toggleThemeModal(show) {
      const modal = document.getElementById('themeModal');
      modal.style.display = (show === undefined ? (modal.style.display === 'flex' ? 'none' : 'flex') : (show ? 'flex' : 'none'));
    }

    function setTheme(themeName) {
      const themes = ['classic', 'cyberpunk', 'matrix', 'sunset', 'midnight', 'frost'];
      themes.forEach(t => {
        document.body.classList.remove('theme-' + t);
        const card = document.getElementById('th_' + t);
        if (card) card.classList.remove('active');
      });
      document.body.classList.add('theme-' + themeName);
      const activeCard = document.getElementById('th_' + themeName);
      if (activeCard) activeCard.classList.add('active');
      localStorage.setItem('pirp_theme', themeName);
      showToast('Theme set to ' + themeName.toUpperCase(), '🎨');
    }

    // Restore saved theme
    const savedTheme = localStorage.getItem('pirp_theme') || 'classic';
    setTheme(savedTheme);

    // -------------------------------------------------------------
    // Toast Notification Utility
    // -------------------------------------------------------------
    let _toastTimer = null;
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('devToast');
      const msgEl = document.getElementById('toastMsg');
      const iconEl = document.getElementById('toastIcon');
      if (!toast || !msgEl) return;
      msgEl.textContent = msg;
      iconEl.textContent = icon;
      toast.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    // -------------------------------------------------------------
    // Secret Dev Mode / Testing Lab
    // -------------------------------------------------------------
    function toggleDevModal(show) {
      const modal = document.getElementById('devModal');
      const isVisible = modal.style.display === 'flex';
      modal.style.display = (show === undefined ? (!isVisible ? 'flex' : 'none') : (show ? 'flex' : 'none'));
    }

    // Keyboard Shortcuts: [~] or [D]
    window.addEventListener('keydown', (e) => {
      if (e.key === '~' || e.key === '`' || (e.key.toLowerCase() === 'd' && !['input','textarea','select'].includes(document.activeElement.tagName.toLowerCase()))) {
        toggleDevModal();
      }
    });

    // Touch / Mobile Trigger: Triple Tap on screen top-left
    let _tapCount = 0;
    let _tapTimer = null;
    window.addEventListener('pointerdown', (e) => {
      if (e.clientX < 80 && e.clientY < 80) {
        _tapCount++;
        clearTimeout(_tapTimer);
        if (_tapCount >= 3) {
          _tapCount = 0;
          toggleDevModal();
        } else {
          _tapTimer = setTimeout(() => { _tapCount = 0; }, 500);
        }
      }
    });

    // Dev Helper: Get Game Engine Models
    function getGameContext() {
      const root = window.__SIM_RUNTIME__ ? window.__SIM_RUNTIME__.activeLevelRoot : null;
      return {
        root: root,
        model: root ? root.$model : null,
        world: window.__SIM_RUNTIME__ ? window.__SIM_RUNTIME__.activePhysicsWorld : null
      };
    }

    // 1. Chips & Spawns
    let _infiniteChipsActive = false;
    let _infiniteChipsInterval = null;

    function devAddChips(count, chipType = 0) {
      const { model } = getGameContext();
      if (!model) { showToast('Game not loaded yet!', '⚠️'); return; }
      if (!model.currentPuckList) model.currentPuckList = [];
      if (!model.totalPuckList) model.totalPuckList = [];
      for (let i = 0; i < count; i++) {
        model.currentPuckList.push(chipType);
        model.totalPuckList.push(chipType);
      }
      const typeName = chipType === 1 ? 'Golden' : chipType === 2 ? 'Charging' : 'Normal';
      showToast('+' + count + ' ' + typeName + ' Chips Added!', '🎱');
    }

    function devRefillChips(amount = 50) {
      const { model } = getGameContext();
      if (!model) return;
      model.currentPuckList = Array(amount).fill(0);
      showToast('Refilled to ' + amount + ' Chips!', '🔋');
    }

    function devToggleInfiniteChips() {
      _infiniteChipsActive = !_infiniteChipsActive;
      const btn = document.getElementById('btnInfiniteChips');
      if (btn) btn.textContent = '♾️ Infinite Chips: ' + (_infiniteChipsActive ? 'ON' : 'OFF');
      if (_infiniteChipsActive) {
        clearInterval(_infiniteChipsInterval);
        _infiniteChipsInterval = setInterval(() => {
          const { model } = getGameContext();
          if (model && model.currentPuckList && model.currentPuckList.length < 5) {
            model.currentPuckList.push(0, 0, 0, 0, 0);
          }
        }, 1000);
        showToast('Infinite Chips Enabled!', '♾️');
      } else {
        clearInterval(_infiniteChipsInterval);
        showToast('Infinite Chips Disabled', '⏹️');
      }
    }

    function devDropChip(xPos) {
      const { root, model } = getGameContext();
      if (!root) { showToast('Game not loaded yet!', '⚠️'); return; }
      if (model && model.currentPuckList && model.currentPuckList.length === 0) {
        model.currentPuckList.push(0);
      }
      if (typeof root.spawnChipInPoint === 'function') {
        root.spawnChipInPoint(xPos);
        showToast('Dropped Chip at X: ' + xPos, '⬇️');
      }
    }

    // 2. Powerup Selection & Placement
    function devSelectPower(powerName) {
      const { root, model } = getGameContext();
      if (!model) { showToast('Game not loaded yet!', '⚠️'); return; }

      const powerDefs = {
        'clonerWall': { name: 'Cloning Wall', target: 'wall', objClass: 'PlayfieldWall', function: 'splitter', parameter: { wallCount: 1, splits: 2 } },
        'bouncyWall': { name: 'Bouncy Wall', target: 'wall', objClass: 'addProperty', function: 'bouncy', parameter: { wallCount: 1, restitution: 0.6, bounceForce: 1000 } },
        'createWall': { name: 'Create Wall', target: 'wall', objClass: 'PlayfieldWall', function: 'create', parameter: { wallCount: 1 } },
        'clonerPeg': { name: 'Cloning Peg', target: 'peg', objClass: 'addProperty', function: 'splitter', parameter: { pegs: 1, splits: 2 } },
        'midasPeg': { name: 'Midas Peg', target: 'peg', objClass: 'addProperty', function: 'midas', parameter: { pegs: 1 } },
        'magnet': { name: 'Magnet Peg', target: 'peg', objClass: 'addProperty', function: 'magnet', parameter: { pegs: 1 } },
        'bouncyPegs2': { name: 'Bouncy Pegs', target: 'peg', objClass: 'addProperty', function: 'bouncy', parameter: { pegs: 2 } },
        'x2Pocket': { name: 'Multiplier Bin', target: 'bucket', objClass: 'addProperty', function: 'multiplier', parameter: { multiplier: 1 } },
        'telePocket': { name: 'Teleport Bin', target: 'bucket', objClass: 'PlayfieldWall', function: 'teleport', parameter: { fallCount: 10 } }
      };

      const pDef = powerDefs[powerName];
      if (pDef) {
        model.currentSelectedPowerup = pDef;
        if (pDef.target === 'wall') {
          model.wallsAddInteractable = true;
          if (root && root.checkFue) root.checkFue('wall');
          showToast('Click any wall slot on board to place ' + pDef.name + '!', '🧱');
        } else if (pDef.target === 'peg') {
          model.pegsInteractable = true;
          if (root && root.checkFue) root.checkFue('peg');
          showToast('Click any peg on board to apply ' + pDef.name + '!', '⚡');
        } else if (pDef.target === 'bucket') {
          model.bucketsInteractable = true;
          showToast('Click any scoring bin at bottom to upgrade!', '💰');
        }
        toggleDevModal(false);
      }
    }

    function devUpgradeAllBins() {
      const { model } = getGameContext();
      if (!model) return;
      for (let i = 1; i <= 9; i++) {
        const b = model['bucket' + i + 'Obj'];
        if (b && typeof b.currentScoreValue === 'number') {
          b.currentScoreValue += 10000;
        }
      }
      showToast('All 9 Bins Upgraded by +10,000!', '🌟');
    }

    // 3. Progression
    function devAddScore(amount) {
      const { model } = getGameContext();
      if (!model) return;
      model.currentScore = (model.currentScore || 0) + amount;
      model.currentTotalGameScore = (model.currentTotalGameScore || 0) + amount;
      showToast('+' + amount.toLocaleString() + ' Score Added!', '🏆');
    }

    function devWinRound() {
      const { model } = getGameContext();
      if (!model) return;
      model.currentScore = Math.max(model.currentScore || 0, model.currentLevelGoal || 1000);
      model.levelCompleteVisible = true;
      toggleDevModal(false);
      showToast('Round Cleared! Victory Screen Active', '🎉');
    }

    function devShowUpgradeChoice() {
      const { model } = getGameContext();
      if (!model) return;
      model.pickAPowerVisible = true;
      toggleDevModal(false);
      showToast('Upgrade Choice Menu Opened', '📋');
    }

    function devRerollUpgrades() {
      const { model } = getGameContext();
      if (!model) return;
      model.refreshPowerups = true;
      showToast('Rerolled 3 Random Upgrades', '🎲');
    }

    function devJumpLevel(lvlIndex) {
      const { model } = getGameContext();
      if (!model) return;
      model.currentLevel = parseInt(lvlIndex, 10);
      showToast('Jumped to Level ' + (parseInt(lvlIndex, 10) + 1), '🚀');
    }

    // 4. Physics Tuning
    function devSetGravity(val) {
      document.getElementById('gravVal').textContent = val + 'x';
      const { world } = getGameContext();
      if (world && typeof world.setGravity === 'function') {
        const baseG = 9.8 * parseFloat(val);
        if (window.Box2D && window.Box2D.Common && window.Box2D.Common.Math && window.Box2D.Common.Math.b2Vec2) {
          world.setGravity(new window.Box2D.Common.Math.b2Vec2(0, baseG));
        } else if (typeof world.getGravity === 'function') {
          const g = world.getGravity();
          if (g) g.y = baseG;
        }
        showToast('Gravity set to ' + val + 'x', '🌍');
      }
    }

    function devSetBounce(val) {
      document.getElementById('bounceVal').textContent = val + 'x';
      showToast('Bounce factor adjusted to ' + val + 'x', '🏀');
    }

    // -------------------------------------------------------------
    // Core Engine Bootstrap
    // -------------------------------------------------------------
    function loadJS() {
      const scriptTag = document.createElement('script');
      scriptTag.src = 'main.min.js?t=' + Date.now();
      scriptTag.addEventListener('load', renderGame);
      document.head.appendChild(scriptTag);
    }
    loadJS();
  </script>
</body>
